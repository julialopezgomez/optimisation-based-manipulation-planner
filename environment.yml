name: obmp
channels:
  - conda-forge
dependencies:
  # Drake's wheels require pip >= 20.3.
  - python=3.13
  - pip>=20.3
  - pip:
      # Drake (pydrake) Python bindings
      - drake
      # Notebook / visualization stack
      - ipykernel
      - jupyterlab
      - ipywidgets==8.0.4
      - widgetsnbextension==4.0.5
      - jupyterlab-widgets
      - plotly
      # Math / optimization helpers used in notebooks
      - scipy>=1.12
      - pymcubes==0.1.4
      - cvxpy
      - mosek
