name: obmp
channels:
  - conda-forge
dependencies:
  # Drake's wheels require pip >= 20.3.
  - python=3.13
  - pip>=20.3
  - pip:
      # Drake (pydrake) Python bindings.
      # Pinned: 1.49+ has a MOSEK-solver regression that breaks a QP this
      # project relies on (see #76 - drake==1.48.0 is the last known-good
      # version). Don't bump without re-checking that issue.
      - drake==1.48.0
      # Notebook / visualization stack
      - ipykernel
      - jupyterlab
      - ipywidgets==8.0.4
      - widgetsnbextension==4.0.5
      - jupyterlab-widgets
      - plotly
      # Math / optimization helpers used in notebooks
      - scipy>=1.12
      - pymcubes==0.1.4
      - cvxpy
      - mosek
      - quadprog
